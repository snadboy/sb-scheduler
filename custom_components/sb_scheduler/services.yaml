query_day_set:
  fields:
    day_set:
      required: true
      example: school_day
      selector:
        text:
    date:
      selector:
        date:

refresh:

create_schedule:
  fields:
    name:
      required: true
      example: Bedside lamps wake-up
      selector:
        text:
    day_set:
      required: true
      example: workday
      selector:
        text:
    pattern:
      required: true
      example: '{"type": "occurrences", "occurrences": ["06:30"]}'
      selector:
        object:
    actions:
      required: true
      example: '[{"service": "light.turn_on", "entity_id": "light.bedside_lamps"}]'
      selector:
        object:
    conditions:
      selector:
        object:
    condition_type:
      selector:
        text:
    track_conditions:
      selector:
        boolean:
    enabled:
      selector:
        boolean:

edit_schedule:
  fields:
    schedule_id:
      required: true
      selector:
        text:
    name:
      selector:
        text:
    day_set:
      selector:
        text:
    pattern:
      selector:
        object:
    actions:
      selector:
        object:
    enabled:
      selector:
        boolean:

remove_schedule:
  fields:
    schedule_id:
      required: true
      selector:
        text:

run_now:
  target:
    entity:
      domain: switch
      integration: sb_scheduler

set_day_set:
  fields:
    id:
      example: election_day
      selector:
        text:
    name:
      required: true
      example: Election Day
      selector:
        text:
    weekdays:
      example: '["mon"]'
      selector:
        object:
    base_day_set:
      example: monday
      selector:
        text:
    base_calendars:
      selector:
        object:
    base_dates:
      example: '2026-12-25, 2027-06-05..2027-08-17'
      selector:
        text:
    holidays_country:
      example: US
      selector:
        text:
    holidays_subdiv:
      example: IL
      selector:
        text:
    holidays_observed:
      selector:
        boolean:
    holidays_remove:
      example: '["Columbus Day", "Veterans Day"]'
      selector:
        object:
    exclude_day_sets:
      example: '["holiday"]'
      selector:
        object:
    exclude_calendars:
      selector:
        object:
    exclude_dates:
      selector:
        text:
    exclude_match:
      selector:
        text:
    force_calendars:
      selector:
        object:
    force_dates:
      selector:
        text:
    force_match:
      selector:
        text:
    pick:
      example: nth_of_month
      selector:
        select:
          options: ["none", "every", "nth_of_month"]
    pick_every:
      selector:
        number:
          min: 1
          max: 366
    pick_anchor:
      selector:
        date:
    pick_nth:
      selector:
        select:
          options: ["1", "2", "3", "4", "5", "last"]
    months:
      example: '["11"]'
      selector:
        object:
    invert:
      selector:
        boolean:
    offset_days:
      selector:
        number:
          min: -30
          max: 30
    expose_calendar:
      selector:
        boolean:

remove_day_set:
  fields:
    id:
      required: true
      example: election_day
      selector:
        text:

list_holidays:
  fields:
    country:
      required: true
      example: US
      selector:
        text:
    subdiv:
      example: IL
      selector:
        text:
    year:
      selector:
        number:
          min: 2000
          max: 2100
