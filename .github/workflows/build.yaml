name: Build

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Zip integration
        run: |
          cd custom_components/sb_scheduler/
          zip ../../sb_scheduler.zip -r ./

      - uses: JasonEtco/upload-to-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ./sb_scheduler.zip application/zip
